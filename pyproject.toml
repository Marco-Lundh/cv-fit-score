[project]
name = "cv-fit-score"
version = "0.1.0"
description = "CV Fit Score API — AI-powered CV analysis against job descriptions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "groq>=0.11.0",
    "pdfplumber>=0.11.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["*_test.py"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
omit = ["src/*_test.py"]

[tool.coverage.report]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
